[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energyfl"
version = "1.0.0"
description = "The Energy Cost of Privacy in Federated Learning"
license = { file = "LICENSE" }
dependencies = [
    "flwr[simulation]>=1.33.0",           # needs --federation-config
    "flwr-datasets[vision]>=0.5.0,<0.6.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "opacus>=1.5.0",
    "nvidia-ml-py>=12.0.0",
    "numpy",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["energyfl"]

[tool.flwr.app]
publisher = "local"

[tool.flwr.app.components]
serverapp = "energyfl.server_app:app"
clientapp = "energyfl.client_app:app"

# Defaults; run.sh overrides the per-run values.
[tool.flwr.app.config]
dataset = "har"                  # "har" or "cifar10"
epsilon = "inf"                  # "inf" = non-private baseline
seed = 0
run-id = "test"
results-dir = "results/test"
num-server-rounds = 100          # HAR 100, CIFAR-10 30
num-supernodes = 21              # HAR 21 participants, CIFAR-10 20
fraction-train = 0.5
fraction-evaluate = 0.5
dirichlet-alpha = 0.5            # CIFAR-10 only
batch-size = 32
local-epochs = 1
learning-rate = 0.01
clipping-norm = 1.0
