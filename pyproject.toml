[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energyfl"
version = "0.1.0"
description = "Energy cost of privacy in federated learning"
license = { file = "LICENSE" }
dependencies = [
    # >=1.33 is required, not merely preferred: a rebuild that silently
    # resolved 1.31 produced runs stuck in `pending` (CLI/SuperLink version
    # mismatch) and a SuperLink that would not start against a 1.33 state DB.
    "flwr[simulation]>=1.33.0",
    # Must stay below 0.6.0: flwr-datasets 0.6.0 requires rich<14, while
    # flwr>=1.33 requires rich>=14, and pip cannot resolve both. 0.5.0
    # declares no rich constraint at all, so it coexists with 1.33/1.34; its
    # only overlap with flwr is numpy, at an identical range. Revisit when a
    # flwr-datasets release relaxes the rich bound.
    "flwr-datasets[vision]>=0.5.0,<0.6.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "nvidia-ml-py>=12.0.0",
    "matplotlib",
    "opacus>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["energyfl"]

[tool.flwr.app]
publisher = "local"


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
#######################################################################

# [tool.flwr.federations]
# default = "local-sim"

# [tool.flwr.federations.local-sim]
# address = ":local:"

[tool.flwr.app.components]
serverapp = "energyfl.server_app:app"
clientapp = "energyfl.client_app:app"

[tool.flwr.app.config]
seed = 0
epsilon = "inf"
run-id = ""
num-server-rounds = 30
num-supernodes = 20
fraction-train = 0.5
fraction-evaluate = 0.5
dirichlet-alpha = 0.5
batch-size = 32
local-epochs = 1
learning-rate = 0.01
save-model = false
# Clipping norm C. FIXED at 1.0 for the main sweep; the ablation overrides it.
clipping-norm = 1.0
# Where run_*.json is written. Overridden by the ablation script so those
# runs never mix into the main sweep's statistics.
results-dir = ""
# Seconds of quiet-GPU sampling used to establish the idle baseline that
# net-of-idle energy subtracts. 0 falls back to a single instantaneous read.
idle-probe-s = 5.0